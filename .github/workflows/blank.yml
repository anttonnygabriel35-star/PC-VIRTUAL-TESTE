name: CI
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request event
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the A
  workflow_dispatch:

# A workflow run is made up of one or more jobs that ca
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be
    steps:
      # Checks-out your repository under $GITHUB_WORKSP
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!
